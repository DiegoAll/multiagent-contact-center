<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 860" width="1600" height="860" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <title>Arquitectura de NovaCX Agent Lab</title>
  <desc>Cliente y asesor usan un frontend React; la API Go llama al servicio del agente (LangGraph), que usa un LLM, embeddings, LangSmith, un servidor MCP en Go y PostgreSQL con pgvector.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#0e1330"/>
    </marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#7a82a6"/>
    </marker>
  </defs>

  <rect width="1600" height="860" fill="#f3f4fa"/>
  <text x="40" y="52" font-size="26" font-weight="800" fill="#0e1330">NovaCX Agent Lab</text>
  <text x="40" y="78" font-size="15" fill="#576082">Contact center con agente multiagente, RAG, tools MCP y ticketing</text>

  <!-- Personas -->
  <g>
    <rect x="40" y="330" width="190" height="110" rx="16" fill="#ffffff" stroke="#c9cde6" stroke-width="2"/>
    <text x="135" y="372" text-anchor="middle" font-size="17" font-weight="700" fill="#0e1330">Cliente</text>
    <text x="135" y="394" text-anchor="middle" font-size="13" fill="#576082">chatea con Nova</text>
    <text x="135" y="420" text-anchor="middle" font-size="17" font-weight="700" fill="#0e1330">Asesor</text>
  </g>

  <!-- Frontend -->
  <g>
    <rect x="285" y="300" width="230" height="170" rx="16" fill="#3a2bf2"/>
    <text x="400" y="338" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">Frontend</text>
    <text x="400" y="360" text-anchor="middle" font-size="13" fill="#dcd9ff">React · Vite · TypeScript · Tailwind</text>
    <text x="400" y="380" text-anchor="middle" font-size="13" fill="#dcd9ff">servido por nginx</text>
    <text x="400" y="414" text-anchor="middle" font-size="13" fill="#ffffff">Portal · Chat de Nova</text>
    <text x="400" y="434" text-anchor="middle" font-size="13" fill="#ffffff">Consola de asesores</text>
  </g>

  <!-- API -->
  <g>
    <rect x="585" y="300" width="250" height="170" rx="16" fill="#ffffff" stroke="#3a2bf2" stroke-width="3"/>
    <text x="710" y="338" text-anchor="middle" font-size="18" font-weight="800" fill="#0e1330">API REST</text>
    <text x="710" y="360" text-anchor="middle" font-size="13" fill="#576082">Go · chi · goose · Swagger</text>
    <text x="710" y="394" text-anchor="middle" font-size="13" fill="#0e1330">controller → service</text>
    <text x="710" y="414" text-anchor="middle" font-size="13" fill="#0e1330">→ repository (interfaces)</text>
    <text x="710" y="440" text-anchor="middle" font-size="12" fill="#576082">API key · rate limit · token interno</text>
  </g>

  <!-- Agente -->
  <rect x="905" y="100" width="440" height="500" rx="20" fill="#eceaff" stroke="#3a2bf2" stroke-width="3"/>
  <text x="1125" y="134" text-anchor="middle" font-size="18" font-weight="800" fill="#1b1370">Servicio del agente</text>
  <text x="1125" y="155" text-anchor="middle" font-size="13" fill="#576082">Python · FastAPI · LangChain · LangGraph</text>

  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="1020" y="178" width="210" height="44" rx="12" fill="#0e1330"/>
    <text x="1125" y="206" fill="#ffffff">Guardrails de entrada</text>

    <rect x="1020" y="252" width="210" height="44" rx="12" fill="#0e1330"/>
    <text x="1125" y="280" fill="#ffffff">Supervisor (LLM)</text>

    <rect x="920" y="344" width="125" height="86" rx="12" fill="#ffffff" stroke="#0e1330" stroke-width="2"/>
    <text x="982" y="372" fill="#0e1330">Conocimiento</text>
    <text x="982" y="392" font-size="12" font-weight="500" fill="#576082">RAG + fuentes</text>

    <rect x="1062" y="344" width="125" height="86" rx="12" fill="#ffffff" stroke="#0e1330" stroke-width="2"/>
    <text x="1124" y="372" fill="#0e1330">Transacciones</text>
    <text x="1124" y="392" font-size="12" font-weight="500" fill="#576082">tool calling</text>

    <rect x="1204" y="344" width="125" height="86" rx="12" fill="#ffffff" stroke="#ff4b5c" stroke-width="2"/>
    <text x="1266" y="372" fill="#0e1330">Traspaso</text>
    <text x="1266" y="392" font-size="12" font-weight="500" fill="#576082">humano · ticket</text>

    <rect x="1020" y="480" width="210" height="44" rx="12" fill="#0e1330"/>
    <text x="1125" y="508" fill="#ffffff">Calidad (filtro de salida)</text>
  </g>
  <text x="1125" y="560" text-anchor="middle" font-size="12" fill="#576082">Memoria de conversación por sesión</text>

  <!-- Flechas dentro del agente -->
  <g stroke="#0e1330" stroke-width="2" fill="none" marker-end="url(#arr)">
    <path d="M1125 222V250"/>
    <path d="M1125 296V318L982 318V342"/>
    <path d="M1125 296V342"/>
    <path d="M1125 296V318L1266 318V342"/>
    <path d="M982 430V455L1090 455V478"/>
    <path d="M1124 430V478"/>
    <path d="M1266 430V455L1160 455V478"/>
  </g>

  <!-- Externos -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="1420" y="110" width="150" height="64" rx="14" fill="#ffffff" stroke="#7a82a6" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="1495" y="138" fill="#0e1330">LLM</text>
    <text x="1495" y="158" font-size="12" font-weight="500" fill="#576082">OpenAI o DeepSeek</text>

    <rect x="1420" y="206" width="150" height="64" rx="14" fill="#ffffff" stroke="#7a82a6" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="1495" y="234" fill="#0e1330">Embeddings</text>
    <text x="1495" y="254" font-size="12" font-weight="500" fill="#576082">OpenAI</text>

    <rect x="1420" y="302" width="150" height="64" rx="14" fill="#ffffff" stroke="#7a82a6" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="1495" y="330" fill="#0e1330">LangSmith</text>
    <text x="1495" y="350" font-size="12" font-weight="500" fill="#576082">trazas (opcional)</text>
  </g>
  <g stroke="#7a82a6" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#arrd)">
    <path d="M1345 142H1418"/>
    <path d="M1345 238H1418"/>
    <path d="M1345 334H1418"/>
  </g>

  <!-- MCP y base de datos -->
  <g>
    <rect x="935" y="660" width="240" height="120" rx="16" fill="#ffffff" stroke="#3a2bf2" stroke-width="3"/>
    <text x="1055" y="694" text-anchor="middle" font-size="18" font-weight="800" fill="#0e1330">Servidor MCP</text>
    <text x="1055" y="715" text-anchor="middle" font-size="13" fill="#576082">Go · mcp-go · Streamable HTTP</text>
    <text x="1055" y="742" text-anchor="middle" font-size="12" fill="#0e1330">get_customer · list_customer_orders</text>
    <text x="1055" y="760" text-anchor="middle" font-size="12" fill="#0e1330">create_ticket · escalate_to_human</text>

    <rect x="585" y="660" width="250" height="120" rx="16" fill="#0e1330"/>
    <text x="710" y="694" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">PostgreSQL 16</text>
    <text x="710" y="715" text-anchor="middle" font-size="13" fill="#c9cde6">con extensión pgvector</text>
    <text x="710" y="742" text-anchor="middle" font-size="12" fill="#ffc62b">CRM simulado: clientes, pedidos, tickets</text>
    <text x="710" y="760" text-anchor="middle" font-size="12" fill="#ffc62b">Embeddings de la base de conocimiento</text>
  </g>

  <!-- Flechas principales -->
  <g stroke="#0e1330" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <path d="M230 385H283"/>
    <path d="M515 385H583"/>
    <path d="M835 385H903"/>
    <path d="M710 470V658"/>
    <path d="M1055 600V658"/>
    <path d="M935 720H837"/>
    <path d="M930 600L930 630L790 630L790 658" />
  </g>

  <g font-size="12" fill="#576082" text-anchor="middle">
    <text x="257" y="374">HTTPS</text>
    <text x="549" y="374">/api/v1</text>
    <text x="869" y="374">HTTP</text>
    <text x="1120" y="636" text-anchor="start">tools por MCP</text>
    <text x="886" y="712" >SQL</text>
    <text x="728" y="560" text-anchor="start">SQL</text>
    <text x="920" y="620" text-anchor="end">RAG: búsqueda vectorial</text>
  </g>

  <text x="40" y="832" font-size="13" fill="#576082">Todo corre en docker-compose. Solo el frontend (3000) y la API (8080) se publican en 127.0.0.1; el agente, el MCP y la base de datos quedan en la red interna.</text>
</svg>
